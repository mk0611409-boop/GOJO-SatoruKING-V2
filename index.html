<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👑 GOJO SATRO KING</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top, #1a0b2e 0%, #0a0a0a 60%);
            color: white;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .title-font { font-family: 'Cinzel', serif; }
        .glow-purple { box-shadow: 0 0 40px rgba(139, 92, 246, 0.4); }
        .gold-text { 
            color: #fbbf24; 
            text-shadow: 0 0 20px rgba(251, 191, 36, 0.5); 
        }
        .glass {
            background: rgba(20, 20, 25, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(139, 92, 246, 0.3);
        }
    </style>
</head>
<body>

    <header class="text-center mt-16 px-4 w-full flex flex-col items-center">
        <div class="w-48 h-48 md:w-56 md:h-56 rounded-full border-4 border-purple-500 glow-purple overflow-hidden mb-6 relative">
            <img src="https://upload.wikimedia.org/wikipedia/en/2/2f/Satoru_Gojo.png" 
                 alt="Gojo Satoru" 
                 class="w-full h-full object-cover">
        </div>
        
        <h1 class="title-font text-4xl md:text-6xl gold-text mb-2 text-center tracking-wider">
            👑 GOJO SATRO KING 👑
        </h1>
        <p class="text-gray-400 text-sm md:text-lg max-w-xl mx-auto text-center font-semibold tracking-wide">
            The Strongest. The Honored One. <br>
            Ask the Six Eyes Oracle anything about the anime world.
        </p>
    </header>

    <section class="w-full max-w-2xl mt-10 px-4 mb-20">
        <div class="glass rounded-2xl p-6 shadow-2xl relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-purple-500 to-transparent"></div>

            <h2 class="title-font text-2xl text-purple-400 mb-2 flex items-center gap-2">
                <span>🔮</span> The Six Eyes Oracle
            </h2>
            
            <!-- مربع إدخال المفتاح -->
            <div class="mb-4">
                <input type="password" id="api-key-input" placeholder="Enter your OpenRouter API Key (sk-or-...)" 
                       class="w-full bg-black/50 border border-purple-500/30 rounded-lg p-2 text-xs text-purple-300 focus:outline-none">
            </div>

            <div id="chat-box" class="h-72 overflow-y-auto mb-4 bg-black/60 p-4 rounded-xl flex flex-col space-y-3 text-sm scrollbar-thin">
                <div class="text-gray-400 italic">> Oracle is ready. Ask your question, mortal.</div>
            </div>

            <div class="flex gap-2">
                <input type="text" id="user-input" 
                       placeholder="Who is the strongest sorcerer?" 
                       class="flex-1 bg-black/50 border border-gray-600 rounded-lg p-3 text-white focus:outline-none focus:border-purple-500 transition-colors">
                <button onclick="askOracle()" 
                        class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-6 rounded-lg transition-all transform hover:scale-105 shadow-lg shadow-purple-500/30">
                    Ask
                </button>
            </div>
        </div>
    </section>

    <script>
        async function askOracle() {
            const input = document.getElementById('user-input');
            const chatBox = document.getElementById('chat-box');
            const keyInput = document.getElementById('api-key-input').value.trim();
            const question = input.value.trim();

            if (!question) return;
            if (!keyInput) {
                alert("Please enter your OpenRouter API Key first!");
                return;
            }

            chatBox.innerHTML += `<div class="text-right text-purple-300 bg-purple-900/20 p-2 rounded-lg"><strong>You:</strong> ${question}</div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            const loadingId = "loading-" + Date.now();
            chatBox.innerHTML += `<div id="${loadingId}" class="text-gray-500 animate-pulse">> The Six Eyes are analyzing...</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${keyInput}`,
                        "HTTP-Referer": "https://github.com", 
                        "X-Title": "Gojo Satro King" 
                    },
                    body: JSON.stringify({
                        model: "google/gemini-2.0-flash-exp:free",
                        messages: [
                            { 
                              role: "system", 
                              content: "You are the Six Eyes Oracle for GOJO SATRO KING. Answer anime questions accurately with details and a royal, confident tone like Gojo Satoru. If you don't know, say so." 
                            },
                            { role: "user", content: question }
                        ]
                    })
                });

                const data = await response.json();
                
                if(data.error) throw new Error(data.error.message);
                
                const answer = data.choices[0].message.content;

                document.getElementById(loadingId).remove();
                chatBox.innerHTML += `<div class="text-gray-300 bg-gray-800/50 p-2 rounded-lg"><strong>Oracle:</strong> ${answer}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;

            } catch (error) {
                document.getElementById(loadingId).remove();
                chatBox.innerHTML += `<div class="text-red-400 bg-red-900/20 p-2 rounded-lg">> Error: ${error.message}</div>`;
            }
        }

        document.getElementById('user-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') askOracle();
        });
    </script>
</body>
</html>
